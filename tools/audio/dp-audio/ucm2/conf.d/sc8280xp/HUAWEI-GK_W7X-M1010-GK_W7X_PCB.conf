Syntax 4

# The hardware long name comes from DMI, not /sound/model.
# Only the isolated test model selects the DP audio configuration.
If.DPAudioTest {
    Condition {
        Type String
        String1 "${CardName}"
        String2 "SC8280XP-HUAWEI-GAOKUN3-DPAUDIO"
    }
    True.Include.dp.File "/conf.d/sc8280xp/SC8280XP-HUAWEI-GAOKUN3-DPAUDIO.conf"
    False.Include.original.File "/Qualcomm/sc8280xp/sc8280xp.conf"
}
