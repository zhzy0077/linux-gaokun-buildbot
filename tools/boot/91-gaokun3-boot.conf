# Shared by fresh installs, image builds and kernel RPM upgrades.
hostonly="no"
hostonly_cmdline="no"
# ath11k can request net-pf-42 from asynchronous PCIe probe. Load QRTR
# before udev coldplug to avoid module-init/async-probe circular waiting.
force_drivers+=" qrtr "
add_dracutmodules+=" crypt "
add_drivers+=" dm_crypt btrfs nvme usbhid i2c-hid-of hid-multitouch msm panel-himax-hx83121a himax_hx83121a_spi "
