name: Build Installer - Fedora Gaokun3 USB image

on:
  workflow_dispatch:
    inputs:
      kernel_tag:
        description: Linux stable tag
        type: string
        required: true
        default: v7.2.9
      package_release_tag:
        description: Reuse a matching RPM release for image-only retries (empty rebuilds RPMs)
        type: string
        required: false
        default: ''
      image_size:
        description: Uncompressed USB image size (6G fits typical 8 GB media)
        type: string
        required: true
        default: 6G

permissions:
  contents: write

jobs:
  packages:
    if: ${{ inputs.package_release_tag == '' }}
    uses: ./.github/workflows/gaokun3-package-rpms.yml
    with:
      kernel_tag: ${{ inputs.kernel_tag }}
      build_el2: true
    secrets: inherit

  installer:
    needs: packages
    if: ${{ !cancelled() && (needs.packages.result == 'success' || needs.packages.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    env:
      FEDORA_RELEASE: '44'
      KERNEL_TAG: ${{ inputs.kernel_tag }}
      IMAGE_SIZE: ${{ inputs.image_size }}
      PACKAGE_RELEASE_TAG: ${{ inputs.package_release_tag || needs.packages.outputs.package_release_tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify the selected RPM release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/installer/download-rpms.py \
            --repository "$GITHUB_REPOSITORY" --tag "$PACKAGE_RELEASE_TAG" --kernel-tag "$KERNEL_TAG" \
            --output "$RUNNER_TEMP/gaokun-rpms"
      - name: Build network installer image
        run: |
          df -h "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/gaokun-installer" "$RUNNER_TEMP/gaokun-artifacts"
          sudo docker run --rm --privileged \
            -v /dev:/dev \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/gaokun-rpms:/rpms:ro" \
            -v "$RUNNER_TEMP/gaokun-installer:/work" \
            -v "$RUNNER_TEMP/gaokun-artifacts:/artifacts" \
            -e GAOKUN_DIR=/src -e WORKDIR=/work -e PACKAGE_RPMS_DIR=/rpms \
            -e ARTIFACT_DIR=/artifacts -e FEDORA_RELEASE -e IMAGE_SIZE \
            fedora:44 bash -euo pipefail -c '
              dnf -y install dnf5 dnf5-plugins createrepo_c pykickstart python3 \
                rpm-build util-linux parted dosfstools btrfs-progs rsync xz zstd \
                policycoreutils systemd-udev
              bash /src/scripts/ci/52_build_installer_image.sh
            '
      - name: Upload image and package inventory
        uses: actions/upload-artifact@v6
        with:
          name: fedora44-gaokun3-installer-aarch64
          compression-level: 0
          path: |
            ${{ runner.temp }}/gaokun-artifacts/*.img.xz
            ${{ runner.temp }}/gaokun-artifacts/SHA256SUMS
            ${{ runner.temp }}/gaokun-artifacts/media-rpm-manifest.json
            ${{ runner.temp }}/gaokun-artifacts/README.txt
      - name: Prepare release
        id: release
        run: |
          cd "$RUNNER_TEMP/gaokun-artifacts"
          # GitHub rejects release assets of 2 GiB or more.
          for file in *.img.xz SHA256SUMS media-rpm-manifest.json; do
            size=$(stat -c %s "$file")
            [[ $size -lt 2147483648 ]] || { echo "$file is $size bytes, over the release asset limit" >&2; exit 1; }
          done
          image=$(ls *.img.xz)
          tag="fedora${FEDORA_RELEASE}-gaokun3-installer-${KERNEL_TAG//[^A-Za-z0-9._-]/-}-el2-$(date -u +%Y%m%d%H%M%S)"
          {
            echo '## Fedora Linux 44 network installer for Gaokun3'
            echo
            echo "- Kernel tag: \`${KERNEL_TAG}\` (EL2), packages from \`${PACKAGE_RELEASE_TAG}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${image}\` ($(numfmt --to=iec-i --suffix=B "$(stat -c %s "$image")"), ${IMAGE_SIZE} uncompressed)"
            echo
            echo '## Install'
            echo
            echo '1. Verify with `sha256sum -c SHA256SUMS`, then write the image to a USB drive:'
            echo '   Rufus on Windows, or `xz -dc '"$image"' | sudo dd of=/dev/sdX bs=4M conv=fsync status=progress` on Linux.'
            echo '2. Disable Secure Boot in the firmware setup (F2), then boot the USB drive from the boot menu (F12).'
            echo '3. Connect to Wi-Fi when asked. Anaconda downloads Fedora packages from the mirrors;'
            echo '   the Gaokun kernel, firmware and platform packages come from the USB drive.'
            echo
            echo 'Details: [tools/installer/README.md](https://github.com/'"$GITHUB_REPOSITORY"'/blob/'"$GITHUB_SHA"'/tools/installer/README.md)'
          } > release-notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Fedora Linux ${{ env.FEDORA_RELEASE }} - gaokun3 - Network installer - ${{ env.KERNEL_TAG }} + EL2
          body_path: ${{ runner.temp }}/gaokun-artifacts/release-notes.md
          files: |
            ${{ runner.temp }}/gaokun-artifacts/*.img.xz
            ${{ runner.temp }}/gaokun-artifacts/SHA256SUMS
            ${{ runner.temp }}/gaokun-artifacts/media-rpm-manifest.json
